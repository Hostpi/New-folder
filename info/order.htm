<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร - Test คาเฟ่ & ร้านอาหาร</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:0;
        }

        header{
            background:#ff7043;
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:#333;
            text-align:center;
            padding:12px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
        }

        .container{
            width:80%;
            max-width:700px;
            margin:30px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
        }

        label{
            display:block;
            margin-top:15px;
            font-weight:bold;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            box-sizing:border-box;
        }

        .food-item{
            margin-top:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
        }

        .food-item label{
            flex:2;
        }

        .food-item input{
            flex:1;
            padding:8px;
        }

        button{
            margin-top:20px;
            padding:10px 20px;
            background:#ff7043;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
            width:100%;
        }

        button:hover{
            background:#e64a19;
        }

        .reset-btn{
            background:#555;
            margin-top:10px;
        }

        .reset-btn:hover{
            background:#333;
        }

        footer{
            background:#333;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:20px;
        }
    </style>

</head>

<body>

<header>
    <h1>แบบฟอร์มสั่งอาหาร</h1>
</header>

<nav>
    <a href="index.htm">หน้าแรก</a>
    <a href="menu.htm">เมนูอาหาร</a>
    <a href="order.htm">สั่งอาหาร</a>
</nav>

<div class="container">

<h2>กรอกข้อมูลการสั่งอาหาร</h2>

<form>

<label>ชื่อ - นามสกุล</label>
<input type="text" required>

<label>เบอร์โทรศัพท์</label>
<input type="tel" required>

<label>ที่อยู่จัดส่ง</label>
<textarea rows="3" required></textarea>

<label>วันจัดส่ง</label>
<input type="date" required>

<label>เวลาจัดส่ง</label>
<input type="time" required>

<hr>

<h2>รายการอาหาร</h2>

<div class="food-item">
    <label>ข้าวผัดทะเล (120 บาท)</label>
    <input type="number" min="0" value="0">
</div>

<div class="food-item">
    <label>ผัดกะเพราเนื้อ (95 บาท)</label>
    <input type="number" min="0" value="0">
</div>

<div class="food-item">
    <label>สเต๊กหมู (159 บาท)</label>
    <input type="number" min="0" value="0">
</div>

<div class="food-item">
    <label>เฟรนช์ฟรายส์ (69 บาท)</label>
    <input type="number" min="0" value="0">
</div>

<div class="food-item">
    <label>ฮันนี่โทสต์ (149 บาท)</label>
    <input type="number" min="0" value="0">
</div>

<div class="food-item">
    <label>บิงซู (149 บาท)</label>
    <input type="number" min="0" value="0">
</div>

<label>คำสั่งพิเศษ</label>
<textarea rows="3"></textarea>

<button type="submit">ยืนยันการสั่งอาหาร</button>
<button type="reset" class="reset-btn">ล้างข้อมูล</button>

</form>

</div>

<footer>
    <p>Test คาเฟ่ & ร้านอาหาร 2026</p>
</footer>

</body>
</html>
